<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ColorSplit Pro</title>

    <meta name="description"
          content="Professional CMYK Color Separation Software">

    <meta name="theme-color"
          content="#000000">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black">

    <meta name="apple-mobile-web-app-title"
          content="ColorSplit Pro">

    <link rel="manifest"
          href="manifest.json">

    <link rel="icon"
          href="assets/logo.png">

    <link rel="apple-touch-icon"
          href="assets/logo.png">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/home.css">

    <link rel="stylesheet"
          href="css/loading.css">

    <link rel="stylesheet"
          href="css/workspace.css">

</head>

<body>

    <!-- =====================================
         APPLICATION ROOT
    ====================================== -->

    <div id="app"></div>

    <!-- =====================================
         CORE
    ====================================== -->

    <script src="js/state.js"></script>

    <script src="js/router.js"></script>

    <!-- =====================================
         UTILS
    ====================================== -->

    <script src="js/utils/helper.js"></script>

    <!-- =====================================
         ENGINES
    ====================================== -->

    <script src="js/engines/previewEngine.js"></script>

    <!--
    importEngine.js
    colorEngine.js
    separationEngine.js
    exportEngine.js

    Akan ditambahkan pada milestone berikutnya.
    -->

    <!-- =====================================
         PAGES
    ====================================== -->

    <script src="js/pages/home.js"></script>

    <script src="js/pages/loading.js"></script>

    <script src="js/pages/workspace.js"></script>

    <!-- =====================================
         MAIN APP
    ====================================== -->

    <script src="js/app.js"></script>

    <!-- =====================================
         SERVICE WORKER
    ====================================== -->

    <script>

    if("serviceWorker" in navigator){

        window.addEventListener("load",()=>{

            navigator.serviceWorker
            .register("./sw.js")
            .then(reg=>{

                console.log("Service Worker Registered",reg);

            })
            .catch(err=>{

                console.error("SW Error",err);

            });

        });

    }

    </script>

</body>

</html>
