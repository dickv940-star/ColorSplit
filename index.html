<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">


<meta name="viewport"
      content="width=device-width, initial-scale=1.0">


<title>
ColorSplit Pro
</title>


<meta name="description"
content="Professional CMYK Color Separation and FreeHand Prepress Software">


<meta name="theme-color"
content="#000000">


<!-- PWA -->

<meta name="mobile-web-app-capable"
content="yes">


<meta name="apple-mobile-web-app-capable"
content="yes">


<meta name="apple-mobile-web-app-status-bar-style"
content="black">


<meta name="apple-mobile-web-app-title"
content="ColorSplit Pro">



<link rel="manifest"
href="./manifest.json">



<link rel="icon"
href="./assets/logo.png">



<link rel="apple-touch-icon"
href="./assets/logo.png">





<!-- =========================================

========================================= -->


<link rel="stylesheet"
href="./css/style.css">

href="./css/home.css">


<link rel="stylesheet"
href="./css/loading.css">


<link rel="stylesheet"
href="./css/workspace.css">


<link rel="stylesheet"
href="./css/prepress.css">



</head>




<body>


<!-- =========================================
 APPLICATION ROOT
========================================= -->


<div id="app"></div>





<!-- =========================================
 CORE SYSTEM
========================================= -->


<script src="./js/state.js"></script>
      
<script src="./js/workspace/workspaceState.js"></script>

<script src="./js/router.js"></script>


<script src="./js/utils/helper.js"></script>





<!-- =========================================
 FILE ENGINE
========================================= -->


<script src="./js/engines/fileReader.js"></script>


<script src="./js/engines/metadataReader.js"></script>


<script src="./js/engines/imageLoader.js"></script>


<script src="./js/engines/colorDetector.js"></script>


<script src="./js/engines/previewLoader.js"></script>





<!-- =========================================
 COLOR ENGINE
========================================= -->


<script src="./js/engines/color/iccConverter.js"></script>


<script src="./js/engines/color/adobeProfile.js"></script>


<script src="./js/engines/color/gamutMapper.js"></script>


<script src="./js/engines/color/colorDifference.js"></script>


<script src="./js/engines/color/colorInspector.js"></script>


<script src="./js/engines/color/colorHistory.js"></script>


<script src="./js/engines/color/paletteManager.js"></script>





<!-- =========================================
 COLOR SCIENCE
========================================= -->


<script src="./js/engines/color/cmykSeparation.js"></script>


<script src="./js/engines/color/softProof.js"></script>


<script src="./js/engines/color/deltaE.js"></script>


<script src="./js/engines/color/halftoneEngine.js"></script>

 FREEHAND PREPRESS ENGINE
========================================= -->


<script src="./js/engines/freehand/objectDetector.js"></script>


<script src="./js/engines/freehand/fillDetector.js"></script>


<script src="./js/engines/freehand/strokeDetector.js"></script>


<script src="./js/engines/freehand/textDetector.js"></script>


<script src="./js/engines/freehand/layerBuilder.js"></script>


<script src="./js/engines/freehand/freehandAnalyzer.js"></script>





<!-- =========================================
 PREPRESS UI ENGINE
========================================= -->


<script src="./js/ui/prepress/prepressPanel.js"></script>


<script src="./js/ui/prepress/objectPanel.js"></script>


<script src="./js/ui/prepress/colorPanel.js"></script>


<script src="./js/ui/prepress/printPanel.js"></script>





<!-- =========================================
 PAGE SYSTEM
========================================= -->


<script src="./js/pages/home.js"></script>


<script src="./js/pages/loading.js"></script>


<script src="./js/pages/workspace.js"></script>





<!-- =========================================
 APPLICATION BOOT
========================================= -->


<script src="./js/app.js"></script>





<!-- =========================================
 SERVICE WORKER
========================================= -->


<script>


if(
"serviceWorker" in navigator
){


window.addEventListener(
"load",
function(){


navigator.serviceWorker
.register(
"./sw.js"
)


.then(
function(){

console.log(
"Service Worker Registered"
);

}
)



.catch(
function(error){

console.error(
"Service Worker Error",
error
);

}

);


});


}



</script>



</body>


</html>
