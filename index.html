<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ColorSplit Pro</title>

    <meta name="description"
          content="Professional CMYK Color Separation Software">

    <meta name="theme-color"
          content="#000000">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black">

    <meta name="apple-mobile-web-app-title"
          content="ColorSplit Pro">

    <link rel="manifest"
          href="./manifest.json">

    <link rel="icon"
          href="./assets/logo.png">

    <link rel="apple-touch-icon"
          href="./assets/logo.png">

    <!-- ==========================================
         CSS
    =========================================== -->

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/home.css">
    <link rel="stylesheet" href="./css/loading.css">
    <link rel="stylesheet" href="./css/workspace.css">

</head>

<body>

    <!-- ==========================================
         APP ROOT
    =========================================== -->

    <div id="app"></div>

    <!-- ==========================================
         CORE
    =========================================== -->

    <script src="./js/state.js"></script>
    <script src="./js/router.js"></script>

    <!-- ==========================================
         UTILS
    =========================================== -->

    <script src="./js/utils/helper.js"></script>

    <!-- ==========================================
         ENGINES
    =========================================== -->

    <script src="./js/engines/fileReader.js"></script>
    <script src="./js/engines/metadataReader.js"></script>
    <script src="./js/engines/imageLoader.js"></script>
    <script src="./js/engines/colorDetector.js"></script>
    <script src="./js/engines/previewLoader.js"></script>

    <!-- Engine berikut akan ditambahkan nanti -->

    <!--
    <script src="./js/engines/pdfReader.js"></script>
    <script src="./js/engines/tiffReader.js"></script>
    <script src="./js/engines/iccReader.js"></script>
    <script src="./js/engines/histogramEngine.js"></script>
    <script src="./js/engines/separationEngine.js"></script>
    <script src="./js/engines/exportEngine.js"></script>
    -->

    <!-- ==========================================
         PAGES
    =========================================== -->

    <script src="./js/pages/home.js"></script>
    <script src="./js/pages/loading.js"></script>
    <script src="./js/pages/workspace.js"></script>

    <!-- ==========================================
         MAIN APPLICATION
    =========================================== -->

    <script src="./js/app.js"></script>

    <!-- ==========================================
         SERVICE WORKER
    =========================================== -->

    <script>

    if ("serviceWorker" in navigator) {

        window.addEventListener("load", () => {

            navigator.serviceWorker
                .register("./sw.js")
                .then(reg => {

                    console.log("Service Worker Registered");

                })
                .catch(err => {

                    console.error("Service Worker Error", err);

                });

        });

    }

    </script>

</body>

</html>
